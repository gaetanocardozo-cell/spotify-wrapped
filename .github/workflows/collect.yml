# Polls Spotify listening history every 15 minutes.
#
# Why not Vercel Cron? The Hobby plan rejects any schedule more frequent than
# once a day at deploy time. Spotify only exposes the 50 most recent plays, so a
# daily poll silently loses everything beyond the 50th play each day. GitHub
# Actions gives us a free sub-daily scheduler that just calls the same endpoint.
#
# Setup — add these under Settings → Secrets and variables → Actions:
#   INGEST_URL     https://<your-app>.vercel.app/api/cron/ingest
#   CRON_SECRET    the same value as the Vercel env var
name: Collect listening history

on:
  schedule:
    # Every 15 minutes. GitHub queues these on a best-effort basis and may delay
    # or drop runs when under load, so treat the cadence as approximate.
    - cron: "*/15 * * * *"
  workflow_dispatch: # allows a manual run from the Actions tab

# Never let two collections overlap: the ingest is idempotent, but concurrent
# runs would waste API quota and race on the same cursor.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger ingest
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$INGEST_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::INGEST_URL and CRON_SECRET repository secrets must be set."
            exit 1
          fi

          # --fail-with-body so a non-2xx still prints the JSON explaining why.
          http_code=$(curl --silent --show-error --fail-with-body \
            --max-time 120 \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --header "Authorization: Bearer $CRON_SECRET" \
            --write-out "%{http_code}" \
            --output /tmp/response.json \
            "$INGEST_URL") || true

          echo "HTTP $http_code"
          cat /tmp/response.json 2>/dev/null || true
          echo

          # 428 means Spotify was never connected on this deployment: a real
          # setup problem worth failing loudly for.
          if [ "$http_code" = "428" ]; then
            echo "::error::No Spotify account connected on the deployment."
            exit 1
          fi

          case "$http_code" in
            2*) ;;
            *) echo "::error::Ingest failed with HTTP $http_code"; exit 1 ;;
          esac
